# Déploiement sur un serveur unique : PostgreSQL + application + proxy HTTPS (Caddy).
# Non exécuté dans l'environnement de développement initial (pas de Docker) : syntaxe YAML vérifiée seulement.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soloc}
      POSTGRES_DB: ${POSTGRES_DB:-soloc}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-soloc} -d $${POSTGRES_DB:-soloc}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # aucun port publié : la base n'est joignable que depuis le réseau interne

  migrate:
    image: ${SOLOC_IMAGE:-soloc:latest}
    build: .
    env_file: .env.production
    command: ["node", "src/migrate.js"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    image: ${SOLOC_IMAGE:-soloc:latest}
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      HOST: 0.0.0.0
    depends_on:
      db: { condition: service_healthy }
    stop_grace_period: 15s
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?définir DOMAIN dans .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificats : à conserver (sinon limites de délivrance Let's Encrypt)
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
